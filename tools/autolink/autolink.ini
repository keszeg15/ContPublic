# Which notes get links written into them, one pattern per line, relative to
# the content root.
[scope]
G5eC/log/Session*.md

# Notes that only gather what really lives elsewhere. When a name is claimed
# both by a collector and by an ordinary note, the ordinary note wins.
[collectors]
NPC
Griff-ház

# Phrases that never become links, whoever claims them. The party members turn
# up in nearly every session, so linking them would colour half the log without
# telling the reader anything.
[exclude]
Harm
Alex
Arachis
Ryel
Ulrich
Joli

# Headings worth linking, written as `phrase = note#heading`. --scan proposes
# these with a leading # on the entry; delete that # to switch one on.
[headings]
# 10 occurrences in 8 notes
Wilder = Griff-ház#Wilder (ezüst)
# 9 occurrences in 4 notes
Brentulis = Griff-ház#Brentulis (ezüst)
# 9 occurrences in 7 notes
Kozma = Griff-ház#Kozma (bronz)
# 5 occurrences in 4 notes
Tori Sandro = Griff-ház#Tori Sandro (ezüst)
# 2 occurrences in 2 notes
#Éneklő Hold = _foundry_test#Éneklő Hold
# 1 occurrences in 1 notes
Aeden Haert = Griff-ház#Aeden Haert (ezüst)
# 1 occurrences in 1 notes
#Harmony = Party#Harmony (Pöli)
# 1 occurrences in 1 notes
#Jövő = Kapuk Conton#Jövő
# 1 occurrences in 1 notes
#Kapitány = Szárny#Kapitány
